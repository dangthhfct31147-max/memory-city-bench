# Memory City Benchmark defaults
embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 64

index:
  semantic_threshold: 0.75
  max_edges_per_node: 10
  community_algorithm: greedy
  num_topic_hubs: 8

retriever:
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60
  graph_hop_limit: 2
  coordinator_enabled: true

reader:
  provider: none

benchmark:
  dataset: synthetic-tiny
  methods: [bm25, vector, hybrid_rrf, memory_city_full]
  top_k: [1, 3, 5, 10]
  seeds: [42]
  warmup: 5
