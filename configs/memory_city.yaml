# Memory City Benchmark defaults
embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 64

index:
  semantic_threshold: 0.75
  max_edges_per_node: 10
  community_algorithm: greedy
  num_topic_hubs: 8

retriever:
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60
  graph_hop_limit: 2
  coordinator_enabled: true

reader:
  provider: none
  # Optional OmniRoute-style gateway (only used when provider: openai_compatible).
  # base_url and model default to $MEMCITY_LLM_BASE_URL / $MEMCITY_LLM_MODEL.
  base_url: http://localhost:20128/v1
  # api_key_env names the environment variable holding the key; the key value
  # itself is never stored in config or run artifacts.
  api_key_env: MEMCITY_LLM_API_KEY
  disable_gateway_cache: false

benchmark:
  dataset: synthetic-tiny
  methods: [bm25, vector, hybrid_rrf, memory_city_full]
  top_k: [1, 3, 5, 10]
  seeds: [42]
  warmup: 5
